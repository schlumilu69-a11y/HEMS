################################################################################
# SET CURRENT
################################################################################

hems_evbox_set_current:

  alias: HEMS - EVBox Set Current

  mode: restart

  variables:

    current: >
      {{ states('sensor.hems_target_current') | int(6) }}

  sequence:

    - action: script.hems_log
      data:
        message: >
          EVBox: Setze Ladestrom auf {{ current }} A

    - action: ocpp.set_charge_rate
      data:
        devid: "22052459"
        limit_amps: "{{ current }}"
        conn_id: 1

################################################################################
# FORCE 1 PHASE
################################################################################

hems_evbox_phase_1:

  alias: HEMS - EVBox Force 1 Phase

  sequence:

    - action: script.hems_log
      data:
        message: >
          EVBox unterstützt keine Phasenumschaltung.

################################################################################
