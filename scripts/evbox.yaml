################################################################################
# SET CHARGING CURRENT
################################################################################

hems_evbox_set_current:

  alias: HEMS - EVBox Set Current

  mode: restart

  fields:

    current:
      description: Zielstrom in Ampere
      example: 8

  variables:

    target_current: >
      {{ current | int(6) }}

    actual_current: >
      {{ states('sensor.22052459_current_offered') | int(0) }}

  sequence:

    ###########################################################################
    # Keine Änderung notwendig
    ###########################################################################

    - if:

        - condition: template
          value_template: >
            {{ actual_current == target_current }}

      then:

        - action: script.hems_log
          data:
            message: >
              EVBox:
              Ladestrom bereits {{ actual_current }} A

        - stop "Keine Änderung erforderlich"

    ###########################################################################
    # Logging
    ###########################################################################

    - action: script.hems_log
      data:
        message: >
          EVBox:
          Ladestrom {{ actual_current }} A → {{ target_current }} A

    ###########################################################################
    # OCPP
    ###########################################################################

    - action: ocpp.set_charge_rate
      data:
        devid: "22052459"
        conn_id: 1
        limit_amps: "{{ target_current }}"

