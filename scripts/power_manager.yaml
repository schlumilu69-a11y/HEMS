################################################################################
# HEMS POWER MANAGER
################################################################################

hems_power_manager:

  alias: HEMS - Power Manager

  mode: single

  variables:

    ###########################################################################
    # Zielstrom
    ###########################################################################

    target_current: >
      {{ states('sensor.hems_target_current') | int(6) }}

    ###########################################################################
    # Aktive Wallbox
    ###########################################################################

    active_wallbox: >
      {{ states('input_select.hems_active_wallbox') | lower }}

    ###########################################################################
    # Aktueller Sollstrom der aktiven Wallbox
    ###########################################################################

    current_current: >

      {% if active_wallbox == 'go-e' %}
        {{ states('number.goe_082888_amp') | int(6) }}

      {% elif active_wallbox == 'evbox' %}
        {{ states('sensor.22052459_current_offered') | int(6) }}

      {% else %}
        6
      {% endif %}

    ###########################################################################
    # Lädt aktuell
    ###########################################################################

    charging: >
      {{ is_state('binary_sensor.hems_charging_active','on') }}

  sequence:

    ###########################################################################
    # Keine aktive Ladung
    ###########################################################################

    - if:
        - condition: template
          value_template: "{{ not charging }}"
      then:
        - stop: "Keine aktive Ladung"

    ###########################################################################
    # Keine Wallbox gewählt
    ###########################################################################

    - if:
        - condition: template
          value_template: >
            {{ active_wallbox not in ['go-e','evbox'] }}
      then:
        - stop: "Keine aktive Wallbox"

    ###########################################################################
    # Bereits korrekt
    ###########################################################################

    - if:
        - condition: template
          value_template: >
            {{ target_current == current_current }}
      then:
        - stop: "Ladestrom bereits korrekt"

    ###########################################################################
    # Logging
    ###########################################################################

    - action: script.hems_log
      data:
        message: >
          Power Manager:
          {{ active_wallbox }}
          {{ current_current }}A → {{ target_current }}A

    ###########################################################################
    # Go-e
    ###########################################################################

    - choose:

        - conditions:
            - condition: template
              value_template: >
                {{ active_wallbox == 'go-e' }}

          sequence:

            - action: script.hems_goe_set_current

        #######################################################################
        # EVBox
        #######################################################################

        - conditions:
            - condition: template
              value_template: >
                {{ active_wallbox == 'evbox' }}

          sequence:

            - action: script.hems_evbox_set_current
