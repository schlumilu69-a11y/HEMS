################################################################################
# HEMS PHASE MANAGER
################################################################################

hems_phase_manager:

  alias: HEMS - Phase Manager

  mode: single

  variables:

    ###########################################################################
    # Configuration
    ###########################################################################

    phase_mode: >
      {{ states('input_select.hems_vehicle_phase_mode') }}

    switching_allowed: >
      {{ is_state('input_boolean.hems_phase_switch_allowed','on') }}

    goe_enabled: >
      {{ is_state('input_boolean.hems_goe_enabled','on') }}

    ###########################################################################
    # Current Status
    ###########################################################################

    current_phases: >
      {{ states('sensor.hems_active_phases') | int(3) }}

    target_phases: >
      {{ states('sensor.hems_target_phases') | int(3) }}

  sequence:

    ###########################################################################
    # Go-e deaktiviert
    ###########################################################################

    - if:
        - condition: template
          value_template: "{{ not goe_enabled }}"
      then:
        - stop: "Go-e deaktiviert"

    ###########################################################################
    # Umschaltung nicht erlaubt
    ###########################################################################

    - if:
        - condition: template
          value_template: "{{ not switching_allowed }}"
      then:
        - stop: "Phasenumschaltung deaktiviert"

    ###########################################################################
    # Manueller Modus
    ###########################################################################

    - choose:

        #######################################################################
        # Immer 1 Phase
        #######################################################################

        - conditions:
            - condition: template
              value_template: "{{ phase_mode == '1' }}"
          sequence:

            - if:
                - condition: template
                  value_template: "{{ current_phases != 1 }}"
              then:

                - action: script.hems_log
                  data:
                    message: "Phase Manager: Umschalten auf 1 Phase"

                - action: script.hems_goe_phase_1

        #######################################################################
        # Immer 3 Phasen
        #######################################################################

        - conditions:
            - condition: template
              value_template: "{{ phase_mode == '3' }}"
          sequence:

            - if:
                - condition: template
                  value_template: "{{ current_phases != 3 }}"
              then:

                - action: script.hems_log
                  data:
                    message: "Phase Manager: Umschalten auf 3 Phasen"

                - action: script.hems_goe_phase_3

        #######################################################################
        # Automatik
        #######################################################################

        - conditions:
            - condition: template
              value_template: "{{ phase_mode == 'Auto' }}"
          sequence:

            - if:
                - condition: template
                  value_template: >
                    {{ target_phases != current_phases }}
              then:

                - choose:

                    ###########################################################
                    # Ziel = 1 Phase
                    ###########################################################

                    - conditions:
                        - condition: template
                          value_template: "{{ target_phases == 1 }}"
                      sequence:

                        - action: script.hems_log
                          data:
                            message: >
                              Phase Manager:
                              Automatik → 1 Phase

                        - action: script.hems_goe_phase_1

                    ###########################################################
                    # Ziel = 3 Phasen
                    ###########################################################

                    - conditions:
                        - condition: template
                          value_template: "{{ target_phases == 3 }}"
                      sequence:

                        - action: script.hems_log
                          data:
                            message: >
                              Phase Manager:
                              Automatik → 3 Phasen

                        - action: script.hems_goe_phase_3
