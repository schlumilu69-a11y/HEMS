################################################################################
#
# HEMS START MANAGER
#
################################################################################

hems_start_manager:

  alias: HEMS - Start Manager

  mode: single

  variables:

    active_wallbox: >
      {{ states('sensor.hems_active_wallbox') | lower }}

  sequence:

    - action: script.hems_log
      data:
        manager: START
        message: >
          Starte {{ active_wallbox }}

    - choose:

        #######################################################################
        # EVBox
        #######################################################################

        - conditions:

            - condition: template
              value_template: >
                {{ active_wallbox == 'evbox' }}

          sequence:

            - action: script.hems_evbox_start

        #######################################################################
        # Go-e
        #######################################################################

        - conditions:

            - condition: template
              value_template: >
                {{ active_wallbox == 'go-e' }}

          sequence:

            - action: script.hems_goe_start

################################################################################
#
# HEMS STOP MANAGER
#
################################################################################

hems_stop_manager:

  alias: HEMS - Stop Manager

  mode: single

  variables:

    active_wallbox: >
      {{ states('sensor.hems_active_wallbox') | lower }}

  sequence:

    - action: script.hems_log
      data:
        manager: STOP
        message: >
          Stoppe {{ active_wallbox }}

    - choose:

        #######################################################################
        # EVBox
        #######################################################################

        - conditions:

            - condition: template
              value_template: >
                {{ active_wallbox == 'evbox' }}

          sequence:

            - action: script.hems_evbox_stop

        #######################################################################
        # Go-e
        #######################################################################

        - conditions:

            - condition: template
              value_template: >
                {{ active_wallbox == 'go-e' }}

          sequence:

            - action: script.hems_goe_stop
