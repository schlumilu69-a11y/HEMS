################################################################################
#
# HEMS WALLBOX MANAGER
#
# Aufgabe:
#   - Priorisierung mehrerer Wallboxen
#   - Entscheidung bei Mindeststrom
#   - Go-e zuerst auf 1 Phase
#   - Danach Stop Manager aufrufen
#
################################################################################

hems_wallbox_manager:

  alias: HEMS - Wallbox Manager

  mode: single

  variables:

    ###########################################################################
    # Aktive Wallbox
    ###########################################################################

    active_wallbox: >
      {{ states('sensor.hems_active_wallbox') | lower }}

    wallbox_current: >
      {{ states('sensor.hems_wallbox_current') | int(0) }}

    min_current: >
      {{ states('input_number.hems_min_current') | int(6) }}

    available_power: >
      {{ states('sensor.hems_available_power') | float(0) }}

    stop_power: >
      {{ states('input_number.hems_stop_power') | float(800) }}

    ###########################################################################
    # Go-e
    ###########################################################################

    goe_charging: >
      {{ states('sensor.goe_082888_car_value') == 'Lädt' }}

    goe_phase_mode: >
      {{ states('select.goe_082888_psm') | int(0) }}

    ###########################################################################
    # EVBox
    ###########################################################################

    evbox_charging: >
      {% set state = states('sensor.22052459_status_connector') %}
      {{ state in ['Charging','Preparing','SuspendedEV'] }}

  sequence:

###############################################################################
# DEBUG
###############################################################################

    - action: script.hems_log
      data:
        manager: WALLBOX
        message: >
          Start |
          Active={{ active_wallbox }} |
          Go-e={{ goe_charging }} |
          EVBox={{ evbox_charging }} |
          Current={{ wallbox_current }}A |
          Available={{ available_power }}W

###############################################################################
# Mindeststrom überhaupt erreicht?
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ wallbox_current > min_current }}

      then:

        - action: script.hems_log
          data:
            manager: WALLBOX
            message: >
              Mindeststrom noch nicht erreicht.

        - stop: "Power Manager übernimmt"

###############################################################################
# Noch genügend PV vorhanden?
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ available_power > (-stop_power) }}

      then:

        - action: script.hems_log
          data:
            manager: WALLBOX
            message: >
              Genügend PV vorhanden.
              Kein Stop erforderlich.

        - stop: "Genügend PV"

###############################################################################
# Beide Wallboxen laden
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ goe_charging and evbox_charging }}

      then:

        - action: script.hems_log
          data:
            manager: WALLBOX
            message: >
              Beide Wallboxen laden.
              Priorität: EVBox stoppen.

        - action: script.hems_stop_manager

        - stop: "Priorisierung"

###############################################################################
# Go-e bei 6A noch 3-phasig?
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{
              active_wallbox == 'go-e'
              and
              goe_phase_mode == 2
            }}

      then:

        - action: script.hems_log
          data:
            manager: WALLBOX
            message: >
              Go-e bei 6A.
              Wechsel auf 1 Phase.

        - action: script.hems_phase_manager

        - stop: "Phasenwechsel"

###############################################################################
# EVBox stoppen
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ active_wallbox == 'evbox' }}

      then:

        - action: script.hems_log
          data:
            manager: WALLBOX
            message: >
              EVBox bei Mindeststrom.
              Starte Stop Manager.

        - action: script.hems_stop_manager

        - stop: "EVBox gestoppt"

###############################################################################
# Go-e 1-phasig -> Stop
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{
              active_wallbox == 'go-e'
              and
              goe_phase_mode == 1
            }}

      then:

        - action: script.hems_log
          data:
            manager: WALLBOX
            message: >
              Go-e bereits 1-phasig.
              Starte Stop Manager.

        - action: script.hems_stop_manager

        - stop: "Go-e gestoppt"

###############################################################################
# ENDE
###############################################################################

    - action: script.hems_log
      data:
        manager: WALLBOX
        message: >
          Keine Aktion erforderlich.

    - stop: "Wallbox Manager beendet"
