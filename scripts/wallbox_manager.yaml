################################################################################
#
# HEMS WALLBOX MANAGER
#
# Aufgabe:
#   - Priorisierung mehrerer Wallboxen
#   - Stopentscheidung erst bei Mindeststrom
#   - Go-e zuerst auf 1 Phase umschalten
#
################################################################################

hems_wallbox_manager:

  alias: HEMS - Wallbox Manager

  mode: single

  variables:

    active_wallbox: >
      {{ states('sensor.hems_active_wallbox') | lower }}

    wallbox_current: >
      {{ states('sensor.hems_wallbox_current') | int(0) }}

    min_current: >
      {{ states('input_number.hems_min_current') | int(6) }}

    available_power: >
      {{ states('sensor.hems_available_power') | float(0) }}

    stop_power: >
      {{ states('input_number.hems_stop_power') | float(800) }}

    goe_charging: >
      {{ states('sensor.goe_082888_car_value') == 'Lädt' }}

    evbox_charging: >
      {% set state = states('sensor.22052459_status_connector') %}
      {{ state in ['Charging','Preparing','SuspendedEV'] }}

    goe_phase_mode: >
      {{ states('select.goe_082888_psm') }}

  sequence:

###############################################################################
# Nur eingreifen wenn beide Wallboxen gleichzeitig laden
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ not (goe_charging and evbox_charging) }}

      then:

        - stop: "Nur eine Wallbox aktiv"

###############################################################################
# Noch nicht Mindeststrom erreicht
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ wallbox_current > min_current }}

      then:

        - stop: "Regelung übernimmt Power Manager"

###############################################################################
# Noch genügend PV vorhanden
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ available_power > (-stop_power) }}

      then:

        - stop: "Keine Abschaltung erforderlich"

###############################################################################
# Go-e zuerst auf 1 Phase
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{
              active_wallbox == 'go-e'
              and
              goe_phase_mode != '1-phasig'
            }}

      then:

        - action: script.hems_log
          data:
            manager: WALLBOX
            message: >
              Go-e bei Mindeststrom.
              Starte Phasenwechsel.

        - action: script.hems_phase_manager

        - stop: "Phasenwechsel"

###############################################################################
# EVBox stoppen
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ active_wallbox == 'evbox' }}

      then:

        - action: script.hems_log
          data:
            manager: WALLBOX
            message: >
              EVBox bei Mindeststrom.
              Stoppe Ladevorgang.

        - action: script.hems_stop_manager

        - stop: "EVBox gestoppt"

###############################################################################
# Go-e stoppen
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ active_wallbox == 'go-e' }}

      then:

        - action: script.hems_log
          data:
            manager: WALLBOX
            message: >
              Go-e bereits 1-phasig.
              Stoppe Ladevorgang.

        - action: script.hems_stop_manager

        - stop: "Go-e gestoppt"
