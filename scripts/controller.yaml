################################################################################
# HEMS CONTROLLER V4
################################################################################

hems_controller:

  alias: HEMS - Main Controller

  mode: single

  sequence:

    ###########################################################################
    # 1. Startbedingungen prüfen
    ###########################################################################

    - action: script.hems_start_manager

    ###########################################################################
    # 2. Nur wenn geladen wird
    ###########################################################################

    - if:

        - condition: state
          entity_id: binary_sensor.hems_charging_active
          state: "on"

      then:

        #######################################################################
        # 2.1 Ladeleistung regeln
        #######################################################################

        - action: script.hems_power_manager

        #######################################################################
        # 2.2 Phasenmanagement
        #######################################################################

        - action: script.hems_phase_manager

        #######################################################################
        # 2.3 Wallbox-Management
        #######################################################################

        - action: script.hems_wallbox_manager

    ###########################################################################
    # 3. Letzten Lauf speichern
    ###########################################################################

    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.hems_last_controller_run
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
