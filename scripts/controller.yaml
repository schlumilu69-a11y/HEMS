################################################################################
#
# HEMS - Home Energy Management System
#
# Version : 1.0.0 Beta
#
# Datei : controller.yaml
#
# Aufgabe:
#
#   - Initialisierung
#   - Statusprüfung
#   - Wallboxauswahl
#   - Start-/Stopentscheidung
#
################################################################################

hems_controller:

  alias: HEMS Controller

  mode: single

  sequence:
###############################################################################
# Controllerlauf speichern
###############################################################################

    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.hems_last_controller_run

      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

###############################################################################
# INITIALISIERUNG
###############################################################################

    - variables:

        #######################################################################
        # HEMS
        #######################################################################

        hems_enabled: >
          {{ is_state('input_boolean.hems_enabled','on') }}

        #######################################################################
        # Wallbox Auswahl
        #######################################################################

        wallbox_mode: >
          {{ states('input_select.hems_controlled_wallbox') }}

        active_wallbox: >
          {{ states('sensor.hems_active_wallbox') }}

        #######################################################################
        # Fahrzeug
        #######################################################################

        vehicle_connected: >
          {{ is_state('binary_sensor.hems_vehicle_connected','on') }}

        charging_active: >
          {{ is_state('binary_sensor.hems_charging_active','on') }}

        #######################################################################
        # Leistung
        #######################################################################

        available_power: >
          {{ states('sensor.hems_available_power') | float(0) }}

        wallbox_power: >
          {{ states('sensor.hems_wallbox_power') | float(0) }}

        wallbox_current: >
          {{ states('sensor.hems_wallbox_current') | int(6) }}

        #######################################################################
        # Einstellungen
        #######################################################################

        start_power: >
          {{ states('input_number.hems_start_power') | float(1500) }}

        stop_power: >
          {{ states('input_number.hems_stop_power') | float(800) }}

        deadband: >
          {{ states('input_number.hems_deadband') | float(150) }}

        min_current: >
          {{ states('input_number.hems_min_ampere') | int(6) }}

        max_current: >
          {{ states('input_number.hems_max_ampere') | int(16) }}

###############################################################################
# HEMS AKTIV?
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ not hems_enabled }}

      then:

        - action: script.hems_log
          data:
            message: >
              Controller: HEMS deaktiviert.

        - stop: "HEMS deaktiviert"

###############################################################################
# FAHRZEUG VERBUNDEN?
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ not vehicle_connected }}

      then:

        - action: script.hems_log
          data:
            message: >
              Controller: Kein Fahrzeug verbunden.

        - stop: Kein Fahrzeug

###############################################################################
# WALLBOX AUSWÄHLEN
###############################################################################

    - variables:

        selected_wallbox: >

          {% if wallbox_mode == 'Auto' %}
            {{ active_wallbox }}
          {% else %}
            {{ wallbox_mode }}
          {% endif %}

###############################################################################
# DEBUG
###############################################################################

    - action: script.hems_log
      data:
        message: >
          Controller:
          Wallbox={{ selected_wallbox }},
          Available={{ available_power }}W,
          Current={{ wallbox_current }}A

###############################################################################
# STARTBEDINGUNG
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{
              not charging_active
              and
              available_power >= start_power
            }}

      then:

        - action: script.hems_log
          data:
            message: >
              Controller:
              Starte Ladevorgang.

        - action: script.hems_charge_start

###############################################################################
# STOPBEDINGUNG
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{
              charging_active
              and
              available_power <= (-stop_power)
            }}

      then:

        - action: script.hems_log
          data:
            message: >
              Controller:
              Stoppe Ladevorgang.

        - action: script.hems_charge_stop

        - stop: "Ladung beendet"

###############################################################################
# HOLD TIME PRÜFEN
###############################################################################

    - variables:

        hold_time: >
          {{ states('input_number.hems_current_hold_time') | int(120) }}

        last_change: >
          {{ states('input_datetime.hems_last_current_change') }}

        seconds_since_change: >

          {% if last_change in ['unknown','unavailable',''] %}
            9999
          {% else %}
            {{ (as_timestamp(now()) - as_timestamp(last_change)) | int }}
          {% endif %}

    - if:

        - condition: template
          value_template: >
            {{ seconds_since_change < hold_time }}

      then:

        - action: script.hems_log
          data:
            message: >
              Controller:
              Hold-Time aktiv ({{ seconds_since_change }}s / {{ hold_time }}s)

        - stop: "Hold-Time aktiv"

###############################################################################
# SOLLSTROM BERECHNEN
###############################################################################

    - variables:

        target_current: >

          {% set amp = wallbox_current %}

          {% if available_power > deadband %}
            {% set amp = amp + 1 %}
          {% elif available_power < (-deadband) %}
            {% set amp = amp - 1 %}
          {% endif %}

          {% if amp < min_current %}
            {% set amp = min_current %}
          {% endif %}

          {% if amp > max_current %}
            {% set amp = max_current %}
          {% endif %}

          {{ amp }}

###############################################################################
# KEINE ÄNDERUNG ERFORDERLICH
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ target_current | int == wallbox_current | int }}

      then:

        - action: script.hems_log
          data:
            message: >
              Controller:
              Sollstrom bereits korrekt
              ({{ wallbox_current }} A)

        - stop: "Keine Änderung erforderlich"

###############################################################################
# DEBUG
###############################################################################

    - action: script.hems_log
      data:
        message: >
          Controller:
          Available={{ available_power }}W |
          Current={{ wallbox_current }}A |
          Target={{ target_current }}A

###############################################################################
# POWER MANAGER
###############################################################################

    - action: script.hems_power_manager
      data:
        target_current: "{{ target_current }}"

###############################################################################
# ZEITSTEMPEL AKTUALISIEREN
###############################################################################

    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.hems_last_current_change

      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

###############################################################################
# PHASE MANAGER
###############################################################################

    - if:

        - condition: state
          entity_id: input_boolean.hems_phase_switch_allowed
          state: "on"

      then:

        - action: script.hems_phase_manager

###############################################################################
# WALLBOX MANAGER
###############################################################################

    - action: script.hems_wallbox_manager

###############################################################################
# CONTROLLER STATUS
###############################################################################

    - choose:

        #######################################################################
        # Lädt
        #######################################################################

        - conditions:

            - condition: state
              entity_id: binary_sensor.hems_charging_active
              state: "on"

          sequence:

            - action: input_text.set_value
              target:
                entity_id: input_text.hems_controller_state
              data:
                value: "Charging"

        #######################################################################
        # Fahrzeug verbunden
        #######################################################################

        - conditions:

            - condition: state
              entity_id: binary_sensor.hems_vehicle_connected
              state: "on"

          sequence:

            - action: input_text.set_value
              target:
                entity_id: input_text.hems_controller_state
              data:
                value: "Connected"

      default:

        - action: input_text.set_value
          target:
            entity_id: input_text.hems_controller_state
          data:
            value: "Idle"

###############################################################################
# DEBUG LOG
###############################################################################

    - action: script.hems_log
      data:
        message: >
          Controller beendet |
          Wallbox={{ selected_wallbox }} |
          Leistung={{ available_power }}W |
          Strom={{ wallbox_current }}A |
          Ziel={{ target_current }}A

###############################################################################
# ENDE
###############################################################################

    - stop: "Controller beendet"
