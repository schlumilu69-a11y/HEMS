alias: HEMS Controller V3
description: Zentrale Regelung des HEMS
mode: single

trigger:

  - platform: state
    entity_id:
      - sensor.hems_grid_power
      - sensor.hems_available_power
      - sensor.hems_active_wallbox

  - platform: time_pattern
    seconds: "/30"

condition:

  - condition: template
    value_template: >
      {{ states('sensor.hems_active_wallbox') != 'None' }}

action:

#
# Werte einlesen
#

- variables:

    available: >
      {{ states('sensor.hems_available_power') | float(0) }}

    current:
      "{{ states('input_number.hems_target_current') | int(6) }}"

    deadband:
      "{{ states('input_number.hems_deadband') | float(150) }}"

    min_current:
      "{{ states('input_number.hems_min_ampere') | int(6) }}"

    max_current:
      "{{ states('input_number.hems_max_ampere') | int(16) }}"

#
# Sollstrom berechnen
#

- variables:

    new_current: >

      {% set amp = current %}

      {% if available > deadband %}
        {% set amp = amp + 1 %}
      {% elif available < -deadband %}
        {% set amp = amp - 1 %}
      {% endif %}

      {% if amp < min_current %}
        {% set amp = min_current %}
      {% endif %}

      {% if amp > max_current %}
        {% set amp = max_current %}
      {% endif %}

      {{ amp }}

#
# Nur schreiben wenn Änderung
#

- if:

    - condition: template
      value_template: >
        {{ new_current | int != current | int }}

  then:

    - service: input_number.set_value
      target:
        entity_id: input_number.hems_target_current

      data:
        value: "{{ new_current }}"
