################################################################################
#
# HEMS - Home Energy Management System
#
# Datei : controller.yaml
#
# Aufgabe:
#   - Initialisierung
#   - Statusprüfung
#   - Sollstrom berechnen
#   - Power Manager aufrufen
#   - Wallbox Manager nur bei Mindeststrom
#
################################################################################

hems_controller:

  alias: HEMS Controller

  mode: restart

  sequence:

###############################################################################
# START
###############################################################################

    - action: script.hems_log
      data:
        manager: CONTROLLER
        message: "Controller gestartet"

    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.hems_last_controller_run
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

###############################################################################
# INITIALISIERUNG
###############################################################################

    - variables:

        hems_enabled: >
          {{ is_state('input_boolean.hems_enabled','on') }}

        wallbox_mode: >
          {{ states('input_select.hems_controlled_wallbox') }}

        active_wallbox: >
          {{ states('sensor.hems_active_wallbox') }}

        charging_active: >
          {{ is_state('binary_sensor.hems_charging_active','on') }}

        available_power: >
          {{ states('sensor.hems_available_power') | float(0) }}

        wallbox_current: >
          {{ states('sensor.hems_wallbox_current') | int(6) }}

        start_power: >
          {{ states('input_number.hems_start_power') | float(1500) }}

        stop_power: >
          {{ states('input_number.hems_stop_power') | float(800) }}

        deadband: >
          {{ states('input_number.hems_deadband') | float(150) }}

        min_current: >
          {{ states('input_number.hems_min_ampere') | int(6) }}

        max_current: >
          {{ states('input_number.hems_max_ampere') | int(16) }}

###############################################################################
# HEMS AKTIV?
###############################################################################

    - if:

        - condition: template
          value_template: "{{ not hems_enabled }}"

      then:

        - action: script.hems_log
          data:
            manager: CONTROLLER
            message: "HEMS deaktiviert."

        - stop: "HEMS deaktiviert"

###############################################################################
# WALLBOX AUSWÄHLEN
###############################################################################

    - variables:

        connected_wallbox: >
          {{ states('sensor.hems_connected_wallbox') }}

        selected_wallbox: >
          {% if wallbox_mode == 'Auto' %}
           {{ connected_wallbox }}
          {% else %}
            {{ wallbox_mode | lower }}
          {% endif %}

###############################################################################
# DEBUG
###############################################################################

    - action: script.hems_log
      data:
        manager: CONTROLLER
        message: >
          Wallbox={{ selected_wallbox }},
          Available={{ available_power }}W,
          Current={{ wallbox_current }}A

###############################################################################
# START MANAGER
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{
              not charging_active
              and
              available_power >= start_power
            }}

      then:

        - action: script.hems_start_manager

###############################################################################
# HOLD TIME
###############################################################################

    - variables:

        hold_time: >
          {{ states('input_number.hems_current_hold_time') | int(60) }}

        last_change: >
          {{ states('input_datetime.hems_last_current_change') }}

        seconds_since_change: >
          {% if last_change in ['unknown','unavailable',''] %}
            9999
          {% else %}
            {{ (as_timestamp(now()) - as_timestamp(last_change)) | int }}
          {% endif %}

    - if:

        - condition: template
          value_template: >
            {{ seconds_since_change < hold_time }}

      then:

        - action: script.hems_log
          data:
            manager: CONTROLLER
            message: >
              Hold-Time aktiv ({{ seconds_since_change }}s / {{ hold_time }}s)

        - stop: "Hold-Time aktiv"

###############################################################################
# SOLLSTROM BERECHNEN
###############################################################################

    - variables:

        target_current: >

          {% set amp = wallbox_current %}

          {% if available_power > deadband %}
            {% set amp = amp + 1 %}
          {% elif available_power < (-deadband) %}
            {% set amp = amp - 1 %}
          {% endif %}

          {% if amp < min_current %}
            {% set amp = min_current %}
          {% endif %}

          {% if amp > max_current %}
            {% set amp = max_current %}
          {% endif %}

          {{ amp }}

###############################################################################
# HELPER AKTUALISIEREN
###############################################################################

    - action: input_number.set_value
      target:
        entity_id: input_number.hems_target_current
      data:
        value: "{{ target_current }}"

###############################################################################
# KEINE ÄNDERUNG
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ target_current | int == wallbox_current | int }}

      then:

        - action: script.hems_log
          data:
            manager: CONTROLLER
            message: >
              Sollstrom bereits korrekt
              ({{ wallbox_current }} A)

        - action: script.hems_power_manager

        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.hems_last_current_change
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

###############################################################################
# DEBUG
###############################################################################

    - action: script.hems_log
      data:
        manager: CONTROLLER
        message: >
          Available={{ available_power }}W |
          Current={{ wallbox_current }}A |
          Target={{ target_current }}A

###############################################################################
# POWER MANAGER
###############################################################################

    - action: script.hems_power_manager

###############################################################################
# ZEITSTEMPEL AKTUALISIEREN
###############################################################################

    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.hems_last_current_change
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

###############################################################################
# WALLBOX MANAGER
###############################################################################

    - if:

        - condition: template
          value_template: >
            {{ wallbox_current | int <= min_current }}

      then:

        - action: script.hems_wallbox_manager

###############################################################################
# STATUS
###############################################################################

    - choose:

        - conditions:

            - condition: state
              entity_id: binary_sensor.hems_charging_active
              state: "on"

          sequence:

            - action: input_text.set_value
              target:
                entity_id: input_text.hems_controller_state
              data:
                value: "Charging"

        - conditions:

            - condition: state
              entity_id: binary_sensor.hems_vehicle_connected
              state: "on"

          sequence:

            - action: input_text.set_value
              target:
                entity_id: input_text.hems_controller_state
              data:
                value: "Connected"

      default:

        - action: input_text.set_value
          target:
            entity_id: input_text.hems_controller_state
          data:
            value: "Idle"

###############################################################################
# ENDE
###############################################################################

    - action: script.hems_log
      data:
        manager: CONTROLLER
        message: >
          Controller beendet |
          Wallbox={{ selected_wallbox }} |
          Leistung={{ available_power }}W |
          Strom={{ wallbox_current }}A |
          Ziel={{ target_current }}A

    - stop: "Controller beendet"
