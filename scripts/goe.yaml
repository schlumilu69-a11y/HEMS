################################################################################
#
# HEMS - GO-E DRIVER
#
# Version : 1.0.0
#
# Aufgabe:
#   Hardwaretreiber für die Go-e Wallbox
#
# Der Treiber kennt KEINE Regelungslogik.
# Er setzt ausschließlich Start/Stop, Ladestrom und Phasenmodus.
#
################################################################################

################################################################################
# START CHARGING
################################################################################

hems_goe_start:

  alias: HEMS - Go-e Start

  mode: single

  sequence:

    - action: script.hems_log
      data:
        message: "Go-e: Starte Ladevorgang"

    - action: number.set_value
      target:
        entity_id: number.goe_082888_frc
      data:
        value: 2

################################################################################
# STOP CHARGING
################################################################################

hems_goe_stop:

  alias: HEMS - Go-e Stop

  mode: single

  sequence:

    - action: script.hems_log
      data:
        message: "Go-e: Stoppe Ladevorgang"

    - action: number.set_value
      target:
        entity_id: number.goe_082888_frc
      data:
        value: 1

################################################################################
# SET CURRENT
################################################################################

hems_goe_set_current:

  alias: HEMS - Go-e Set Current

  mode: restart

  fields:

    current:
      description: Zielstrom in Ampere
      example: 8

  variables:

    current: >
      {{ current | int(6) }}

    current_actual: >
      {{ states('number.goe_082888_amp') | int(6) }}

  sequence:

    ###########################################################################
    # Keine Änderung erforderlich
    ###########################################################################

    - if:

        - condition: template
          value_template: >
            {{ current == current_actual }}

      then:

        - stop: "Go-e Strom bereits korrekt."

    ###########################################################################
    # Logging
    ###########################################################################

    - action: script.hems_log
      data:
        message: >
          Go-e:
          {{ current_actual }}A → {{ current }}A

    ###########################################################################
    # Strom setzen
    ###########################################################################

    - action: number.set_value
      target:
        entity_id: number.goe_082888_amp
      data:
        value: "{{ current }}"

################################################################################
# FORCE 1 PHASE
################################################################################

hems_goe_phase_1:

  alias: HEMS - Go-e Phase 1

  mode: single

  sequence:

    - action: script.hems_log
      data:
        message: "Go-e: Umschalten auf 1 Phase"

    - action: select.select_option
      target:
        entity_id: select.goe_082888_psm
      data:
        option: "1"

################################################################################
# FORCE 3 PHASE
################################################################################

hems_goe_phase_3:

  alias: HEMS - Go-e Phase 3

  mode: single

  sequence:

    - action: script.hems_log
      data:
        message: "Go-e: Umschalten auf 3 Phasen"

    - action: select.select_option
      target:
        entity_id: select.goe_082888_psm
      data:
        option: "2"

################################################################################
# AUTO
################################################################################

hems_goe_phase_auto:

  alias: HEMS - Go-e Phase Auto

  mode: single

  sequence:

    - action: script.hems_log
      data:
        message: "Go-e: Automatischer Phasenmodus"

    - action: select.select_option
      target:
        entity_id: select.goe_082888_psm
      data:
        option: "0"
