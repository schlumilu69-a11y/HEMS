hems_evbox_set_current:

  alias: EVBox Sollstrom setzen

  fields:

    current:

  sequence:

    - action: ocpp.set_charge_rate
      data:
        devid: 22052459
        conn_id: 1
        limit_amps: "{{ current | int }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.hems_last_current
      data:
        value: "{{ current | int }}"
