- id: hems_power_manager

  alias: HEMS Power Manager

  trigger:
    - platform: time_pattern
      seconds: "/20"

  condition:
    - condition: state
      entity_id: input_boolean.hems_power_manager_enabled
      state: "on"

  action:

    - variables:

        target: "{{ states('sensor.hems_target_current') | int }}"
        last: "{{ states('input_number.hems_last_current') | int }}"

    - if:
        - condition: template
          value_template: >
            {{ target != last }}
      then:

        - service: script.hems_evbox_set_current
          data:
            current: "{{ target }}"
