################################################################################
#
# HEMS - Home Energy Management System
#
# Version : 0.2.0-alpha
#
# Datei : templates.yaml
#
################################################################################

################################################################################
# Sensoren
################################################################################

- sensor:

###############################################################################
# Grid Power
###############################################################################

    - name: HEMS Grid Power
      unique_id: hems_grid_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {{
          (
            states('sensor.shellyem3_34945475879a_phase_a_leistung') | float(0)
            + states('sensor.shellyem3_34945475879a_phase_b_leistung') | float(0)
            + states('sensor.shellyem3_34945475879a_phase_c_leistung') | float(0)
          ) | round(0)
        }}
###############################################################################
# Charging Power
###############################################################################

    - name: HEMS Charging Power
      unique_id: hems_charging_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        {{ states('sensor.goe_082888_nrg_11') | float(0) }}

###############################################################################
# Charge Current
###############################################################################

    - name: HEMS Charge Current
      unique_id: hems_charge_current
      unit_of_measurement: A
      device_class: current
      state_class: measurement
      state: >
        {{ states('number.goe_082888_amp') | float(0) }}

###############################################################################
# PV Power (Platzhalter)
###############################################################################

    - name: HEMS PV Power
      unique_id: hems_pv_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        0

###############################################################################
# House Power (Platzhalter)
###############################################################################

    - name: HEMS House Power
      unique_id: hems_house_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        0

###############################################################################
# Battery Power (Platzhalter)
###############################################################################

    - name: HEMS Battery Power
      unique_id: hems_battery_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      state: >
        0

###############################################################################
# Available Power
###############################################################################

    - name: HEMS Available Power
      unique_id: hems_available_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      icon: mdi:solar-power
    
      state: >
        {% set grid = states('sensor.hems_grid_power') | float(0) %}
        {% set reserve = states('input_number.hems_power_reserve') | float(300) %}
        {% set available = -grid + reserve %}
    
        {{ available | round(0) }}
        

###############################################################################
# Status
###############################################################################

    - name: HEMS Status
      unique_id: hems_status
      state: >
        {% if is_state('input_boolean.hems_enabled','off') %}
          Disabled
        {% elif is_state('binary_sensor.hems_vehicle_connected','off') %}
          Waiting for vehicle
        {% elif is_state('binary_sensor.hems_charging_active','on') %}
          Charging
        {% else %}
          Ready
        {% endif %}

###############################################################################
# Power Manager
###############################################################################

    - name: HEMS Target Current
      unique_id: hems_target_current
      unit_of_measurement: A
    
      state: >
        {% set available = states('sensor.hems_available_power') | float(0) %}
        {% set phases = 3 %}
        {% set voltage = 230 %}
    
        {% set amp = available / (voltage * phases) %}
    
        {% set min = states('input_number.hems_min_current') | float(6) %}
        {% set max = states('input_number.hems_max_current') | float(16) %}
    
        {% if amp < min %}
          {{ min }}
        {% elif amp > max %}
          {{ max }}
        {% else %}
          {{ amp | round(0) }}
        {% endif %}

################################################################################
# HEMS - Wallbox Sensoren
################################################################################

###########################################################################
# Go-e Ladeleistung
###########################################################################

    - name: HEMS Go-e Power
      unique_id: hems_goe_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W
    
      state: >
        {{ states('sensor.goe_082888_nrg_11') | float(0) }}

###########################################################################
# EVBox Ladeleistung
###########################################################################

    - name: HEMS EVBox Power
      unique_id: hems_evbox_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement
      icon: mdi:ev-station

      state: >

        {% set status = states('sensor.22052459_status_connector') %}
        {% set current = states('sensor.22052459_current_offered') | float(0) %}

        {# Aktuell fest auf 3 Phasen #}
        {% set phases = 3 %}

        {% if status in ['Charging', 'SuspendedEV', 'SuspendedEVSE'] %}
          {{ (230 * phases * current) | round(0) }}
        {% else %}
          0
        {% endif %}

###########################################################################
# Gesamtladeleistung
###########################################################################
    
    - name: HEMS Charging Power
      unique_id: hems_charging_power
      device_class: power
      state_class: measurement
      unit_of_measurement: W
    
      state: >
        {{
          states('sensor.hems_goe_power')|float(0)
          +
          states('sensor.hems_evbox_power')|float(0)
        }}
###########################################################################
# Aktive Wallbox
###########################################################################

    - name: HEMS Active Wallbox
      unique_id: hems_active_wallbox
    
      state: >
    
        {% set goe = states('binary_sensor.goe_082888_fsp') %}
        {% set evbox = states('sensor.22052459_status_connector') %}
    
        {% if goe == 'on' %}
          Go-e
    
        {% elif evbox in [
              'Preparing',
              'Charging',
              'SuspendedEV',
              'SuspendedEVSE'
            ] %}
          EVBox
    
        {% else %}
          Keine
    
        {% endif %}


################################################################################
# Binary Sensoren
################################################################################

- binary_sensor:

###############################################################################
# Enabled
###############################################################################

    - name: HEMS Enabled
      unique_id: hems_enabled
      state: >
        {{ is_state('input_boolean.hems_enabled','on') }}
###########################################################################
# Laden aktiv
###########################################################################

    - name: HEMS Charging Active
      unique_id: hems_charging_active
    
      state: >
        {{
          states('sensor.hems_charging_power')|float(0) > 100
        }}
###############################################################################
# Vehicle Connected
###############################################################################

    - name: HEMS Vehicle Connected
      unique_id: hems_vehicle_connected
      device_class: plug
      state: >
        {{ is_state('binary_sensor.goe_082888_car_0','on') }}

###############################################################################
# Charging Active
###############################################################################

    - name: HEMS Charging Active
      unique_id: hems_charging_active
      device_class: battery_charging
      state: >
        {{ states('sensor.hems_charging_power') | float(0) > 100 }}

###############################################################################
# Grid Import
###############################################################################

    - name: HEMS Grid Import
      unique_id: hems_grid_import
      state: >
        {{ states('sensor.hems_grid_power') | float(0) > 0 }}

###############################################################################
# Grid Export
###############################################################################

    - name: HEMS Grid Export
      unique_id: hems_grid_export
      state: >
        {{ states('sensor.hems_grid_power') | float(0) < 0 }}


###############################################################################
# WALLBOX CURRENT
###############################################################################

    - name: HEMS Wallbox Current
      unique_id: hems_wallbox_current
      unit_of_measurement: A
      device_class: current
      state_class: measurement

      state: >

        {% set wallbox = states('sensor.hems_active_wallbox') %}

        {% if wallbox == 'Go-e' %}
          {{ states('number.goe_082888_amp') | int(6) }}

        {% elif wallbox == 'EVBox' %}
          {{ states('sensor.22052459_current_offered') | int(6) }}

        {% else %}
          0
        {% endif %}
        
###############################################################################
# WALLBOX POWER
###############################################################################

    - name: HEMS Wallbox Power
      unique_id: hems_wallbox_power
      unit_of_measurement: W
      device_class: power
      state_class: measurement

      state: >

        {% set wallbox = states('sensor.hems_active_wallbox') %}

        {% if wallbox == 'Go-e' %}
          {{ states('sensor.hems_goe_power') | float(0) }}

        {% elif wallbox == 'EVBox' %}
          {{ states('sensor.hems_evbox_power') | float(0) }}

        {% else %}
          0
        {% endif %}

###############################################################################
# WALLBOX STATUS
###############################################################################

    - name: HEMS Wallbox Status
      unique_id: hems_wallbox_status

      state: >

        {% set wallbox = states('sensor.hems_active_wallbox') %}

        {% if wallbox == 'Go-e' %}

          {% if is_state('binary_sensor.goe_082888_fsp','on') %}
            Charging
          {% else %}
            Idle
          {% endif %}

        {% elif wallbox == 'EVBox' %}

          {{ states('sensor.22052459_status_connector') }}

        {% else %}
          Idle

        {% endif %}
